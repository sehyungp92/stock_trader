# Simulation policies for missed opportunity backfill
# Covers NQ/MNQ futures and US equities via IBKR

simulation_policies:
  # Helix v4.0 — 1H pullback trend-follow
  helix:
    entry_fill_model: next_trade
    slippage_model: fixed_bps
    slippage_bps: 2.0           # NQ has tight spreads (0.25-0.50 ticks)
    fees_included: true
    fee_bps: 1.0                # ~$4.12 RT on $20k notional NQ ≈ ~2bps, conservative
    tp_sl_logic: atr_based
    tp_value: 1.5               # TP1 at 1.5R (P2), trail handles the rest
    sl_value: 1.0               # 1x initial R from setup
    max_hold_bars: 200

  # NQDTC v2.1 — 30m box-breakout
  nqdtc:
    entry_fill_model: next_trade
    slippage_model: fixed_bps
    slippage_bps: 2.0
    fees_included: true
    fee_bps: 1.0
    tp_sl_logic: atr_based
    tp_value: 1.5               # TP1 at 1.5R
    sl_value: 1.0
    max_hold_bars: 100

  # VdubusNQ v4.2 — 15m VWAP pullback swing
  vdubus:
    entry_fill_model: next_trade
    slippage_model: fixed_bps
    slippage_bps: 2.0
    fees_included: true
    fee_bps: 1.0
    tp_sl_logic: atr_based
    tp_value: 1.0               # +1R partial trigger
    sl_value: 1.0
    max_hold_bars: 128

  # IARIC — intraday US large-cap equities via IBKR
  iaric:
    entry_fill_model: mid          # IBKR smart routing typically fills near mid
    slippage_model: fixed_bps
    slippage_bps: 3.0              # US large-cap equities: ~3 bps typical
    fees_included: true
    fee_bps: 1.0                   # IBKR tiered: ~$0.005/share ≈ 1 bps on $50 stock
    tp_sl_logic: atr_based
    tp_value: 2.0                  # 2× ATR take profit
    sl_value: 1.0                  # 1× ATR stop loss
    max_hold_bars: 78              # Intraday: 6.5h × 12 bars/h (5-min bars)

  # US ORB — opening range breakout, US equities via IBKR
  us_orb:
    entry_fill_model: mid
    slippage_model: fixed_bps
    slippage_bps: 5.0              # ORB entries in first 15 min: wider spreads
    fees_included: true
    fee_bps: 1.0
    tp_sl_logic: atr_based
    tp_value: 1.5                  # ORB: tighter targets
    sl_value: 1.0
    max_hold_bars: 78              # Intraday

  # Fallback
  default:
    entry_fill_model: mid
    slippage_model: fixed_bps
    slippage_bps: 3.0
    fees_included: true
    fee_bps: 1.5
    tp_sl_logic: atr_based
    tp_value: 1.5
    sl_value: 1.0
    max_hold_bars: 100
